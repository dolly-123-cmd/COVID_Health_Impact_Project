<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Community Health Analysis</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef4f7;
            color: #111827;
            min-height: 100vh;
        }

        header {
            background: #0d172b;
            color: white;
            padding: 18px 48px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #20c4b3;
        }

        .register-section {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.12);

            border-top: 5px solid #14b8a6;
        }

        .register-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            background: #c8f7f1;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        .register-card h1 {
            text-align: center;

            color: #0d172b;

            font-size: 30px;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 25px;

            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #172033;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #14b8a6;

            box-shadow:
                0 0 0 3px rgba(20,184,166,0.12);
        }

        .register-btn {
            width: 100%;

            padding: 14px;

            background: #14b8a6;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #0f9f91;
        }

        .error-message {
            background: #fff1f2;

            color: #be123c;

            border: 1px solid #fecdd3;

            border-left: 5px solid #e11d48;

            padding: 13px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-weight: bold;
        }

        .success-message {
            background: #ecfdf5;

            color: #047857;

            border: 1px solid #a7f3d0;

            border-left: 5px solid #10b981;

            padding: 13px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-weight: bold;
        }

        .links {
            text-align: center;

            margin-top: 22px;

            color: #64748b;
        }

        .links a {
            color: #0f766e;

            text-decoration: none;

            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px 20px;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .register-card {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <nav>

        <div class="logo">
            Community Health Analysis
        </div>

        <ul>

            <li>
                <a href="/login">Sign In</a>
            </li>

            <li>
                <a href="/register">Create Account</a>
            </li>

        </ul>

    </nav>

</header>


<section class="register-section">

    <div class="register-card">

        <div class="register-icon">
            👤
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Create your account to access the Community Health Analysis platform.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="success-message">
            {{ success }}
        </div>

        {% endif %}


        <form action="/register" method="POST">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Create a username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required>

            </div>


            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>


        </form>


        <div class="links">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </div>

    </div>

</section>


</body>

</html>
